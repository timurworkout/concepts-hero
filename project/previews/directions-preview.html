<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Направления — превью</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#222;--muted:#6a6a6a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
.dir{position:relative;margin:16px;border-radius:28px;overflow:hidden;color:#fff;min-height:680px;padding:56px 48px;display:grid;grid-template-columns:minmax(0,1fr);align-content:space-between;gap:40px}
.bg{position:absolute;inset:0;opacity:0;transform:scale(1.04);transition:opacity .9s var(--ease),transform 1.6s var(--ease)}.bg.on{opacity:1;transform:none}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05) 40%,rgba(0,0,0,.6))}
.bg span{position:absolute;right:24px;top:20px;font-size:12px;opacity:.7;z-index:1}
.top,.places,.here{position:relative;z-index:1}
h2{margin:0 0 20px;font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.02em;max-width:720px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:15px;font-weight:500;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;cursor:pointer;transition:background .2s,color .2s}
.tab.on{background:#fff;color:var(--ink);border-color:#fff}
.here{font-size:14px;opacity:.85;min-height:20px}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.place{font:inherit;text-align:left;cursor:pointer;border:1px solid transparent;border-radius:20px;padding:20px;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;display:grid;gap:10px;align-content:start;
 opacity:0;transform:translateY(12px);animation:in .5s var(--ease) forwards;transition:background .25s,border-color .25s}
.place:hover,.place.on{background:rgba(0,0,0,.42);border-color:rgba(255,255,255,.5)}
@keyframes in{to{opacity:1;transform:none}}
.place small{font-size:12px;opacity:.7}.place b{font-size:18px;font-weight:600}.place p{margin:0;font-size:14px;line-height:1.4;opacity:.85}
.need{margin-top:6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2);font-size:13px;line-height:1.4;opacity:.85}
.need b{display:block;font-size:14px;font-weight:600;opacity:1}
.note{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;transition:transform .35s var(--ease);max-width:calc(100% - 32px);text-align:center}
.note.on{transform:translateX(-50%)}
.ctx{max-width:760px;margin:40px auto;padding:0 16px;color:var(--muted);font-size:14px;line-height:1.5}
@media(max-width:743px){.dir{margin:8px;padding:32px 16px;min-height:auto;border-radius:20px}.places{grid-template-columns:1fr}.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}}
@media (prefers-reduced-motion:reduce){.place{animation:none;opacity:1;transform:none}.bg{transition:none;transform:none}}
</style>
<section class="dir" id="dir">
 <div id="bgs"></div>
 <div class="top">
  <h2 id="title"></h2>
  <div class="tabs" id="tabs"></div>
 </div>
 <div>
  <div class="places" id="places"></div>
 </div>
</section>
<div class="ctx">Превью v2 блока «Направления». Фон&nbsp;— место, на&nbsp;которое наведён курсор или&nbsp;которое выбрано; градиенты&nbsp;— заглушки под&nbsp;фото мест. Машину не&nbsp;называем: показываем, что&nbsp;место требует от&nbsp;машины, и&nbsp;цену «от». Конкретная машина появляется в&nbsp;подборе. Клик по&nbsp;месту в&nbsp;коде подставит город и&nbsp;цель в&nbsp;визард.</div>
<div class="note" id="note"></div>
<script>
// [тип, место, подпись, что нужно от машины, цена от, градиент-заглушка]
const cities=[
 {id:'sochi',name:'Сочи',from:'из Сочи',places:[
  ['Горы','Горнолыжка в Красной Поляне','Бокс и крепление для лыж уже стоят. Тебе осталось взять лыжи','Полный привод на шипах, бокс',7480,'#2e4a63,#8fb0c9 60%,#e9eef2'],
  ['Горы','Абхазия, озеро Рица','Доверенность на выезд сделаем сами, маршрут в подарок','Клиренс от 170 мм, доверенность',4370,'#123d3a,#2f7d72 55%,#8cc7b5'],
  ['Море','Имеретинская набережная','Парковка у пляжа и багажник под зонт и шезлонги','Компактная, экономичная',3340,'#0f4c75,#3282b8 55%,#f3d9a4'],
  ['Горы','Плато Лаго-Наки','Грунтовка на подъёме — полный привод и клиренс от 200 мм','Полный привод, клиренс от 200 мм',7480,'#3b4a2a,#7a8f4e 55%,#d9d3a0']]},
 {id:'spb',name:'Петербург',from:'из Петербурга',places:[
  ['Природа','Карелия, Рускеала','280 км и грунтовки — клиренс от 190 мм, запас хода от 600 км','Клиренс от 190 мм, запас хода от 600 км',3800,'#1f3d36,#3f6f5f 55%,#9cc2b0'],
  ['Выходные','Выборг на выходные','140 км по трассе — экономичная и с автоматом','Автомат, расход до 8 л',2900,'#3a3550,#6c6487 55%,#c9bfd9'],
  ['Природа','Ладога с палаткой','Палатка, коврики и мангал уже в багажнике. Шашлык — с тебя','Багажник от 480 л, кемпинг-набор',4200,'#22344a,#4d6d8f 55%,#d6c4a0']]},
 {id:'msk',name:'Москва',from:'из Москвы',places:[
  ['Выходные','Золотое кольцо за выходные','600+ км — расход до 8 л и запас хода от 650 км','Запас хода от 650 км',4410,'#4a2a2a,#9a5b3c 55%,#e7c08a'],
  ['Горы','Горнолыжка в Яхроме','Бокс и крепление для лыж, клиренс от 180 мм','Клиренс от 180 мм, бокс',3990,'#2d3a4f,#7f93ad 55%,#eef1f5'],
  ['Дача','Дача, рассада и IKEA','Универсал — багажник от 560 л','Багажник от 560 л',4730,'#2f4a2b,#6d9a52 55%,#d8e6a8']]},
 {id:'kgd',name:'Калининград',from:'из Калининграда',places:[
  ['Море','Куршская коса','Экосбор оплатим заранее — на КПП просто проедешь','Компактная, экосбор оплачен',2760,'#24425a,#5f8aa3 55%,#e8dcb8'],
  ['История','Замки Пруссии','Грунтовки к руинам — клиренс от 190 мм','Клиренс от 190 мм',3610,'#3a3030,#7a6658 55%,#c9b8a2'],
  ['Море','Светлогорск и Зеленоградск','Крепление для велосипеда — катайся по променаду','Крепление для велосипеда',3990,'#1f4d5c,#4f9aa8 55%,#f0e2c0']]}]
const nb=s=>{for(let i=0;i<2;i++)s=s.replace(/(^|[  ])(в|с|на|и|к|по|до|от|за|из|для|не|—) /gi,'$1$2 ');return s.replace(/ —/g,' —')}
const rub=n=>n.toLocaleString('ru-RU')+' ₽'
const $=id=>document.getElementById(id)
$('bgs').innerHTML=cities.flatMap(c=>c.places.map((p,i)=>`<div class="bg" data-k="${c.id}-${i}" style="background:linear-gradient(160deg,${p[5]})"><span>фото: ${p[1]}</span></div>`)).join('')
$('tabs').innerHTML=cities.map(c=>`<button class="tab" data-id="${c.id}">${c.name}</button>`).join('')
let city
function bg(i){
 const p=city.places[i]
 document.querySelectorAll('.bg').forEach(b=>b.classList.toggle('on',b.dataset.k===`${city.id}-${i}`))
 document.querySelectorAll('.place').forEach((b,j)=>b.classList.toggle('on',j===i))
}
function show(id){
 city=cities.find(x=>x.id===id)
 $('title').textContent=nb(`Куда съездить ${city.from}`)
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id))
 $('places').innerHTML=city.places.map(([tag,name,hint,need,p],i)=>`<button class="place" style="animation-delay:${i*70}ms" data-i="${i}">
  <small>${tag}</small><b>${nb(name)}</b><p>${nb(hint)}</p>
  <span class="need"><b>от ${rub(p)} в сутки</b>${nb(need)}</span></button>`).join('')
 $('places').querySelectorAll('.place').forEach(b=>{
  const i=+b.dataset.i
  b.onmouseenter=b.onfocus=()=>bg(i)
  b.onclick=()=>{bg(i);const n=$('note');n.textContent=nb(`В визард: ${city.name} · ${city.places[i][1]} → подбор`);n.classList.add('on');clearTimeout(n.t);n.t=setTimeout(()=>n.classList.remove('on'),2200)}})
 bg(0)
}
$('tabs').onclick=e=>{const t=e.target.closest('.tab');if(t)show(t.dataset.id)}
show('sochi')
</script>
