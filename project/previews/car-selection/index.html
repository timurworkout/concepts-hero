<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ON MOVE — варианты подбора</title><link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="./preview.css"></head><body class="review"><header class="review-bar"><strong>Подбор машины</strong><nav aria-label="Варианты превью"><a href="./tablo.html" target="preview">Табло крупным планом</a><a href="./film.html" target="preview" class="selected">Фотолента</a><a href="./spread.html" target="preview">Разворот</a></nav><button class="device-switch" type="button" aria-pressed="false">390 px</button><a class="open-direct" href="./film.html" target="_blank">Открыть отдельно ↗</a></header><iframe name="preview" title="Превью экрана подбора" src="./film.html"></iframe><script>const device=document.querySelector('.device-switch');device.addEventListener('click',()=>{const on=document.body.classList.toggle('mobile-review');device.setAttribute('aria-pressed',on);device.textContent=on?'На всю ширину':'390 px'});const links=document.querySelectorAll('.review-bar nav a');links.forEach(a=>a.addEventListener('click',()=>{links.forEach(x=>x.classList.remove('selected'));a.classList.add('selected');document.querySelector('.open-direct').href=a.href}));</script></body></html>
