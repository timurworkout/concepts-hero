<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Плитка → визард</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--night:#121314;--accent:#d7f25c;--ink:#222;--muted:#6a6a6a;--hair:#ddd;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
.hero{margin:16px;border-radius:24px;background:var(--night);padding:96px 32px 48px;display:grid;justify-items:center;gap:28px}
h1{margin:0;font-family:'Playfair Display',serif;color:var(--accent);font-size:clamp(28px,4vw,48px);text-align:center;max-width:820px;line-height:1.05}
.wz{position:relative;width:100%;max-width:1000px}
.bar{display:flex;background:#fff;border-radius:999px}
.seg{flex:1;padding:12px 24px;display:grid;gap:2px;border-left:1px solid var(--hair);border-radius:999px;transition:box-shadow .3s}
.seg:first-child{border-left:0;flex:1.5}.seg b{font-size:12px}.seg span{font-size:15px;color:var(--muted)}.seg span.f{color:var(--ink);font-weight:500}
.seg.active{background:#f2f2f2}
.seg.flash{animation:flash .7s var(--ease)}@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}40%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.go{width:52px;height:52px;margin:6px 8px;border-radius:50%;background:var(--accent);flex:none}
.panel{position:absolute;top:calc(100% + 12px);left:0;width:min(480px,100%);background:#fff;border-radius:24px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);
 opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;margin-bottom:8px;border:0;cursor:pointer}
.chip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px}
.cap{font-size:13px;color:var(--muted);font-weight:600;margin:12px 4px 4px}
.item{display:flex;gap:14px;padding:12px 4px;border-bottom:1px solid #eee;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit}
.item:hover{background:#f7f7f7}.item b{display:block;font-weight:500}.item small{color:var(--muted)}
.when{padding:8px 4px}.when p{margin:0 0 8px;font-weight:600}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.days span{padding:10px 0;text-align:center;border-radius:8px;background:#f4f4f4}
section{padding:120px 48px 600px}h2{font-family:'Playfair Display',serif;font-size:40px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:24px}
.tile{border:1px solid var(--hair);border-radius:20px;padding:24px;text-align:left;background:#fff;font:inherit;cursor:pointer;display:grid;gap:8px}
.tile:hover{border-color:var(--ink)}.tile b{font-size:18px}.tile span{color:var(--muted);font-size:14px}.tile u{text-decoration:none;font-weight:600;margin-top:8px}
.note{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px}
@media(max-width:743px){.grid{grid-template-columns:1fr 1fr}section{padding:80px 16px 400px}.panel{position:fixed;inset:0;width:auto;border-radius:0;top:0}.bar{flex-direction:column}.seg{border:0}}
</style>
<div class="hero">
 <h1>Расскажи, что в&nbsp;планах,&nbsp;— подберём лучшую машину для&nbsp;твоей цели</h1>
 <div class="wz" id="wz">
  <div class="bar"><div class="seg" id="place"><b>Куда едешь</b><span id="pv">Город, аэропорт, вокзал</span></div><div class="seg" id="when"><b>Когда</b><span>Даты и&nbsp;время</span></div><div class="seg"><b>Параметры</b><span>Цель, с&nbsp;кем, авто</span></div><div class="go"></div></div>
  <div class="panel" id="panel"></div>
 </div>
</div>
<section><h2>Машина там, где ты</h2><p style="color:var(--muted)">Выбери, где удобнее забрать,&nbsp;— покажем точки в&nbsp;твоём городе</p>
<div class="grid" id="grid"></div></section>
<div class="note">Нажми на&nbsp;плитку внизу</div>
<script>
const data={'К дому':[['Введи адрес','Привезём к подъезду']],'Аэропорт':[['Аэропорт Сочи (Адлер)','Парковка P1, сотрудник с табличкой']],'Вокзал':[['Вокзал Адлер','Парковка у главного входа'],['Вокзал Сочи','Привокзальная площадь']],'Отель':[['Введи название отеля','Привезём к дверям']],'Парковки':[['Центр проката у Морпорта','Работаем 8:00–23:00']]};
const plural={'К дому':'Адрес','Аэропорт':'Аэропорты','Вокзал':'Вокзалы','Отель':'Отели','Парковки':'Парковки'};
const grid=document.getElementById('grid'),panel=document.getElementById('panel'),place=document.getElementById('place'),when=document.getElementById('when');
Object.keys(data).forEach(t=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<b>${t}</b><span>${data[t][0][1]}</span><u>Выбрать точку →</u>`;b.onclick=()=>go(t);grid.append(b)});
function list(t){panel.innerHTML=(t?`<button class="chip" id="chip">${plural[t]} <i>✕</i></button>`:'')+Object.entries(data).filter(([k])=>!t||k===t).map(([k,v])=>`${t?'':`<div class="cap">${plural[k]}</div>`}${v.map(([n,s])=>`<button class="item"><span><b>${n}</b><small>${s}</small></span></button>`).join('')}`).join('');
 const c=document.getElementById('chip');if(c)c.onclick=()=>list(null);
 panel.querySelectorAll('.item').forEach(i=>i.onclick=()=>{document.getElementById('pv').textContent=i.querySelector('b').textContent;document.getElementById('pv').className='f';place.classList.remove('active');when.classList.add('active');panel.innerHTML='<div class="when"><p>Когда забрать</p><div class="days">'+Array.from({length:14},(_,i)=>`<span>${i+20}</span>`).join('')+'</div></div>'})}
function go(t){document.getElementById('wz').scrollIntoView({behavior:'smooth',block:'center'});panel.classList.remove('on');
 setTimeout(()=>{list(t);when.classList.remove('active');place.classList.add('active','flash');panel.classList.add('on');setTimeout(()=>place.classList.remove('flash'),800)},450)}
</script></html>
